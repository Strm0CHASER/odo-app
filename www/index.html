</style></head><body><div id="app"></div><nav id="nav"></nav><button id="fab" data-a="fab"></button><div id="toast"></div><div id="mod"></div><input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const K='odo1',$=s=>document.querySelector(s),FT=['petrol 93','petrol 95','diesel 50ppm','diesel 500ppm'],PT=['business','personal','commute'];const TH=['dark','light','auto'],SY=['terminal','clean','classic'],SC=['burgundy','ocean','forest','amber','plum','mono'],SW={burgundy:'#8B1A32',ocean:'#1F4E7A',forest:'#2F6B3E',amber:'#A35F00',plum:'#6A2C70',mono:'#4A4A4A'};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=(x,d=0)=>{x=parseFloat(String(x).replace(',','.'));return isFinite(x)?x:d},uid=()=>Math.random().toString(36).slice(2,9);
const R=n=>'R'+N(n).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}),K0=n=>Math.round(N(n)).toLocaleString('en-ZA')+' km';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const D=x=>/^\d{4}-\d{2}-\d{2}$/.test(x)?x:today(),T=(x,n=80)=>String(x??'').slice(0,n),O=(x,a,d)=>a.includes(x)?x:d;
const def=()=>({v:[{id:'v1',kind:'personal',name:'My car',fuel:'petrol 95',tank:50,odo0:0}],cur:'v1',fills:[],trips:[],rem:[],set:{unit:'l100',rate:4.76,theme:'auto',scheme:'burgundy',style:'terminal'}});
function clean(o){try{if(!o||typeof o!=='object')return null;const s=def(),A=k=>Array.isArray(o[k])?o[k].slice(0,5000):[];
s.v=A('v').map(v=>({id:T(v.id,20)||uid(),name:T(v.name,40)||'car',kind:O(v.kind,['personal','work'],'personal'),fuel:O(v.fuel,FT,FT[1]),tank:Math.max(1,N(v.tank,50)),odo0:Math.max(0,N(v.odo0))}));
if(!s.v.length)s.v=def().v;s.cur=s.v.some(v=>v.id===o.cur)?o.cur:s.v[0].id;const vi=x=>s.v.some(v=>v.id===x)?x:s.v[0].id;
s.fills=A('fills').map(f=>({id:T(f.id,20)||uid(),vid:vi(f.vid),date:D(f.date),odo:Math.max(0,N(f.odo)),l:Math.max(0,N(f.l)),cost:Math.max(0,N(f.cost)),full:f.full!==false,type:O(f.type,FT,FT[1]),st:T(f.st,60),note:T(f.note,200)})).filter(f=>f.l>0&&f.cost>0);
s.trips=A('trips').map(t=>{const so=Math.max(0,N(t.so)),eo=Math.max(so,N(t.eo)),d=eo>so?eo-so:Math.max(0,N(t.d));return{id:T(t.id,20)||uid(),vid:vi(t.vid),date:D(t.date),so,eo:so+d,d,from:T(t.from,60),to:T(t.to,60),pt:O(t.pt,PT,'personal'),reason:T(t.reason,120),note:T(t.note,200)}}).filter(t=>t.d>0);
s.rem=A('rem').map(r=>({id:T(r.id,20)||uid(),vid:vi(r.vid),name:T(r.name,40)||'reminder',km:Math.max(0,N(r.km)),mo:Math.max(0,Math.round(N(r.mo))),date:D(r.date),odo:Math.max(0,N(r.odo)),paused:r.paused===true}));
const e=o.set||{};s.set={unit:O(e.unit,['l100','kml'],'l100'),rate:Math.max(0,N(e.rate,4.76)),theme:O(e.theme,TH,'auto'),scheme:O(e.scheme,SC,'burgundy'),style:O(e.style,SY,'terminal')};return s}catch(x){return null}}
let S;try{S=clean(JSON.parse(localStorage.getItem(K)))||def()}catch(e){S=def()}
let tab='home',mon=today().slice(0,7),MS=null,tt,et;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const mine=a=>S[a].filter(x=>x.vid===S.cur),inM=d=>d.startsWith(mon),mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const cs=x=>S.set.unit==='l100'?x.toFixed(1)+' l/100km':(100/x).toFixed(1)+' km/l';
const sm=(m,d)=>{const[y,n]=m.split('-').map(Number),t=new Date(y,n-1+d,1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')};
function theme(){const t=S.set.theme,r=document.documentElement,d=r.dataset;d.t=t==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t;d.s=S.set.scheme;d.y=S.set.style;const m=$('#tc');if(m)m.content=getComputedStyle(r).getPropertyValue('--nv').trim()||'#5C4033'}
const chips=(k,l,v)=>'<div style="display:flex;flex-wrap:wrap;gap:6px">'+l.map(x=>`<button class="b ${x===v?'on':''}" data-a="set" data-k="${k}" data-id="${x}"${k==='scheme'?` style="border:2px solid ${SW[x]}"`:''}>[${x}]</button>`).join('')+'</div>';
function vb(){const cv=S.v.find(x=>x.id===S.cur);return`<div class="bar">${['personal','work'].map(k=>`<button class="b ${cv.kind===k?'on':''}" data-a="kind" data-id="${k}">[${k}]</button>`).join('')}<select data-s="veh" aria-label="vehicle" style="flex:1 1 140px;margin:0">${S.v.map(v=>`<option value="${E(v.id)}" ${v.id===S.cur?'selected':''}>${E(v.name)} (${v.kind})</option>`).join('')}</select></div>`}
function calc(){const F=mine('fills').sort((a,b)=>a.odo-b.odo||a.date.localeCompare(b.date));let lf=null,pl=0,pc=0;const sp=[];
F.forEach((f,i)=>{f.pk=i?f.odo-F[i-1].odo:0;f.c=null;if(f.full){if(lf){const km=f.odo-lf.odo;if(km>0){f.c={km,cons:(f.l+pl)/km*100,cpk:(f.cost+pc)/km};sp.push(f)}}lf=f;pl=pc=0}else{pl+=f.l;pc+=f.cost}});
const v=S.v.find(x=>x.id===S.cur);let lo=v.odo0;F.forEach(f=>lo=Math.max(lo,f.odo));mine('trips').forEach(t=>lo=Math.max(lo,t.eo));
const l5=sp.slice(-5),avg=mean(l5.map(f=>f.c.cons));return{F,sp,lf,lo,avg,cpk:mean(l5.map(f=>f.c.cpk)),rng:avg?v.tank/avg*100:0,v}}
function bars(v,lb,cl,mk,fm){if(!v.length)return'<p class="mu">// no data yet</p>';const m=Math.max(...v)||1,w=320,h=96,b=w/v.length;
return`<svg viewBox="0 0 ${w} ${h+30}" width="100%" role="img" font-size="9" fill="currentColor">`+v.map((x,i)=>{const t=x/m*(h-12);return`<rect x="${i*b+3}" y="${h-t}" width="${b-6}" height="${t}" fill="${cl[i%cl.length]}"/><text x="${i*b+b/2}" y="${h-t-3}" text-anchor="middle">${fm(x)}</text><text x="${i*b+b/2}" y="${h+11}" text-anchor="middle" fill="var(--mu)">${E(lb[i])}</text><text x="${i*b+b/2}" y="${h+22}" text-anchor="middle" fill="var(--ac)">${mk[i]||''}</text>`}).join('')+'</svg>'}
function line(v){if(v.length<2)return'<p class="mu">// need two fill-ups</p>';const mx=Math.max(...v),mn=Math.min(...v),r=mx-mn||1,w=320,h=90,p=v.map((x,i)=>[8+i*(w-16)/(v.length-1),h-6-(x-mn)/r*(h-20)]);
return`<svg viewBox="0 0 ${w} ${h+14}" width="100%" font-size="9" fill="currentColor"><polyline points="${p.map(a=>a.join(',')).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2"/>`+p.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="var(--ac)"/>`).join('')+`<text x="2" y="${h+11}">min ${R(mn)}</text><text x="${w-2}" y="${h+11}" text-anchor="end">max ${R(mx)}</text></svg>`}
function donut(d){const t=d.reduce((a,x)=>a+x[1],0);if(!t)return'<p class="mu">// no trips this month</p>';let o=0;
return`<div class="row" style="cursor:default;border:0;justify-content:flex-start"><svg viewBox="0 0 42 42" width="120" height="120">`+d.map(x=>{const p=x[1]/t*100,s=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${x[2]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-o}"/>`;o+=p;return s}).join('')+'</svg><div>'+d.map(x=>`<div><span style="color:${x[2]}">■</span> ${x[0]} ${Math.round(x[1]/t*100)}% (${K0(x[1])})</div>`).join('')+'</div></div>'}
const card=(h,b,c='')=>`<section class="c ${c}"><h2><span class="px">&gt; </span>${h}</h2>${b}</section>`;
const fld=(id,l,v,a='')=>`<label>${l}<input id="${id}" value="${E(v)}" ${a}></label>`,sel=(id,l,a,v)=>`<label>${l}<select id="${id}">${a.map(o=>`<option ${o===v?'selected':''}>${E(o)}</option>`).join('')}</select></label>`;
const del=(k,id)=>`<button class="b" data-a="del" data-k="${k}" data-id="${E(id)}">[ del ]</button>`,rw=(k,id,i,x='')=>`<div class="row" data-a="edit" data-k="${k}" data-id="${E(id)}"><div class="i">${i}</div>${x}</div>`;
function home(c){const mf=c.F.filter(f=>inM(f.date)),mt=mine('trips').filter(t=>inM(t.date)),sp$=mf.reduce((a,f)=>a+f.cost,0),rd=[];
c.F.forEach(f=>rd.push([f.date,f.odo]));mt.concat(mine('trips')).forEach(t=>rd.push([t.date,t.so],[t.date,t.eo]));
const m=rd.filter(r=>inM(r[0])).map(r=>r[1]),bf=rd.filter(r=>r[0]<mon+'-01').map(r=>r[1]),km=m.length?Math.max(...m)-(bf.length?Math.max(...bf):Math.min(...m)):0,ma=mean(c.sp.filter(f=>inM(f.date)).map(f=>f.c.cons));
let h=card('distance',`<div class="big">${K0(km)}</div><div class="t"><div>fuel spend<br><b>${R(sp$)}</b></div><div>avg consumption<br><b>${ma?cs(ma):'—'}</b></div></div><div>cost per km: ${km>0&&sp$?R(sp$/km)+'/km':'—'}</div>`,'hero full');
let g='<p class="wa">// need two full fill-ups to estimate</p>';
if(c.rng&&c.lf){const ks=Math.max(0,c.lo-c.lf.odo),lv=Math.min(1,Math.max(0,1-ks/c.rng)),n=Math.round(lv*20);g=`<div class="gauge">${S.set.style==='terminal'?`[${'█'.repeat(n)+'░'.repeat(20-n)}]`:`<div class="pb"><i style="width:${Math.round(lv*100)}%"></i></div>`} ${Math.round(lv*100)}%</div><div>~${K0(Math.max(0,c.rng-ks))} left on this tank</div>`}
h+=card('tank',g);
const s8=c.sp.slice(-8),cv=s8.map(f=>f.c.cons),mx=Math.max(...cv),mn=Math.min(...cv),dv=x=>S.set.unit==='l100'?x:100/x;
h+=card('consumption',bars(cv.map(dv),s8.map(f=>f.date.slice(8)+'/'+f.date.slice(5,7)),['var(--ac)'],cv.map(x=>cv.length>1?x===mn?'best':x===mx?'worst':'':''),x=>x.toFixed(1))+`<p class="mu">${S.set.unit==='l100'?'l/100km':'km/l'}, last 8 full tanks</p>`);
h+=card('price_per_litre',line(c.F.slice(-10).map(f=>f.cost/f.l)));
const ms=[0,1,2,3,4,5].map(i=>sm(mon,i-5));h+=card('fuel_cost_6m',bars(ms.map(x=>c.F.filter(f=>f.date.startsWith(x)).reduce((a,f)=>a+f.cost,0)),ms.map(x=>new Date(x+'-01T00:00').toLocaleDateString('en-ZA',{month:'short'})),['var(--bt)'],[],x=>Math.round(x)));
const km3=p=>mt.filter(t=>t.pt===p).reduce((a,t)=>a+t.d,0);h+=card('trip_split',donut([['business',km3('business'),'var(--bt)'],['personal',km3('personal'),'var(--ac)'],['commute',km3('commute'),'var(--mu)']]));
let ins=[];const F=c.F;if(F.length>1){const a=F[F.length-1],b=F[F.length-2],d=a.cost/a.l-b.cost/b.l;ins.push(`<div>// price per litre ${d>=0?'up':'down'} ${R(Math.abs(d))} since last fill-up</div>`)}
if(c.sp.length>1){const l=c.sp[c.sp.length-1].c.cons,pa=mean(c.sp.slice(-6,-1).map(f=>f.c.cons)),p=Math.round((l-pa)/pa*100);ins.push(p>15?`<div class="wa">// ! last tank ${p}% worse than your 5-fill average: check tyre pressure and service</div>`:`<div>// last tank ${Math.abs(p)}% ${p<=0?'better':'worse'} than your 5-fill average</div>`)}
h+=card('insights',ins.join('')||'<p class="mu">// add more fill-ups to see insights</p>');
h+=card('quick_add',`<input id="qa" placeholder='45.2l 985 84210  or  trip 18 business sandton' autocomplete="off"><button class="b bt" data-a="qa">[ add ]</button><p class="mu">// litres, rand, odometer | trip km type place</p><p class="wa" id="qe"></p>`,'full');return h}
function fuel(c){const f=c.F.filter(f=>inM(f.date)).reverse();return card('fill_ups',f.length?f.map(f=>rw('fills',f.id,`<b>${f.date}</b> ${f.l.toFixed(2)} l · ${R(f.cost)}${f.full?'':' · partial'}<br><span class="mu">${R(f.cost/f.l)}/l · ${f.pk?K0(f.pk):'—'} · ${f.c?cs(f.c.cons):'—'}</span>`,del('fills',f.id))).join(''):'<p class="mu">// no fill-ups this month</p>','full')}
function trips(c){const t=mine('trips').filter(t=>inM(t.date)).sort((a,b)=>b.date.localeCompare(a.date)),k=p=>t.filter(x=>x.pt===p).reduce((a,x)=>a+x.d,0);
return card('month_summary',`<div>total ${K0(k('business')+k('personal')+k('commute'))}</div><div>business ${K0(k('business'))} · personal ${K0(k('personal'))} · commute ${K0(k('commute'))}</div><div>reimbursement: <b>${R(k('business')*S.set.rate)}</b> @ ${R(S.set.rate)}/km</div><button class="b" data-a="exj">[ logbook json ]</button> <button class="b" data-a="exc">[ logbook csv ]</button>`)+
card('trips',t.length?t.map(x=>rw('trips',x.id,`<b>${x.date}</b> ${E(x.from)||'?'} → ${E(x.to)||'?'}<br><span class="mu">${x.pt} · ${K0(x.d)} · ~${R(x.d*c.cpk)}${x.reason?' · '+E(x.reason):''}</span>`,del('trips',x.id))).join(''):'<p class="mu">// no trips this month</p>')}
function due(r,lo){const p=[];let od=0;if(r.km){const l=r.odo+r.km-lo;od=od||l<0;p.push(l<0?`overdue by ${K0(-l)}`:`due in ${K0(l)}`)}
if(r.mo){const d=new Date(r.date+'T00:00');d.setMonth(d.getMonth()+r.mo);const n=Math.round((d-new Date(today()+'T00:00'))/864e5);od=od||n<0;p.push(n<0?`overdue by ${-n} days`:`due in ${n} days`)}return{t:p.join(' / ')||'no interval',od}}
function service(c){const r=mine('rem');return card('reminders',r.length?r.map(x=>{const d=due(x,c.lo);return`<div class="row" data-a="edit" data-k="rem" data-id="${E(x.id)}"><div class="i"><b>${E(x.name)}</b><br><span class="${d.od&&!x.paused?'wa':'mu'}">${x.paused?'paused':(d.od?'! ':'')+d.t}</span></div><div><button class="b" data-a="done" data-id="${E(x.id)}">[ done ]</button> <button class="b" data-a="pause" data-id="${E(x.id)}">[ ${x.paused?'resume':'pause'} ]</button> ${del('rem',x.id)}</div></div>`}).join(''):'<p class="mu">// no reminders yet</p>','full')}
function setup(c){const s=S.set,op=(a,v)=>a.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('');
return card('vehicles',S.v.map(v=>rw('v',v.id,`<b>${E(v.name)}</b>${v.id===S.cur?' *':''}<br><span class="mu">${v.kind} · ${E(v.fuel)} · ${v.tank} l · start ${K0(v.odo0)}</span>`,S.v.length>1?del('v',v.id):'')).join('')+'<button class="b" data-a="addv">[ add vehicle ]</button>')+
card('settings',`<label>consumption unit<select data-s="unit">${op([['l100','l/100km'],['kml','km/l']],s.unit)}</select></label><label>reimbursement (R per km)<input data-s="rate" inputmode="decimal" value="${s.rate}"></label><label>mode</label>${chips('theme',TH,s.theme)}<label style="margin-top:10px">style</label>${chips('style',SY,s.style)}<label style="margin-top:10px">colours</label>${chips('scheme',SC,s.scheme)}`)+
card('backup',`<button class="b" data-a="exp">[ export json ]</button> <button class="b" data-a="imp">[ import json ]</button> <button class="b wa" data-a="erase" id="er">[ erase all data ]</button><p class="mu">// everything stays on this device</p>`,'full')}
function render(){theme();const c=calc();let h=`<p class="pr">odo@r:~$ ${tab}<i class="cu"></i></p><h1><span class="px"># </span>${tab}</h1>`;
h+=vb();if(0)h+=`<label>vehicle<select data-s="veh">${S.v.map(v=>`<option value="${E(v.id)}" ${v.id===S.cur?'selected':''}>${E(v.name)}</option>`).join('')}</select></label>`;
if(['home','fuel','trips'].includes(tab))h+=`<div class="bar"><button class="b" data-a="pm">[ &lt; ]</button><b>${new Date(mon+'-01T00:00').toLocaleDateString('en-ZA',{month:'long',year:'numeric'}).toLowerCase()}</b><button class="b" data-a="nm">[ &gt; ]</button></div>`;
h+='<div class="g">'+({home,fuel,trips,service,setup}[tab])(c)+'</div>';$('#app').innerHTML=h;
$('#nav').innerHTML=['home','fuel','trips','service','setup'].map(t=>`<button data-a="tab" data-id="${t}" class="${t===tab?'on':''}">[${t}]</button>`).join('');
const f=$('#fab'),l={home:'+ add_fillup',fuel:'+ add_fillup',trips:'+ add_trip',service:'+ add_reminder'}[tab];f.style.display=l?'':'none';f.textContent=l||''}
function mut(fn,msg){const snap=JSON.stringify(S);fn();save();render();toast(msg,snap)}
function toast(m,snap){clearTimeout(tt);$('#toast').innerHTML=`<div class="c"><span>// ${E(m)}</span>${snap?'<button class="b" data-a="undo">[ undo ]</button>':''}</div>`;$('#toast')._s=snap;tt=setTimeout(()=>$('#toast').innerHTML='',6000)}
function mod(t,body,fn){MS=fn;$('#mod').innerHTML=`<div class="mod"><section class="c"><h2><span class="px">&gt; </span>${t}</h2>${body}<p class="wa" id="mer"></p><button class="b bt" data-a="ok">[ save ]</button> <button class="b" data-a="x">[ cancel ]</button></section></div>`;const f=$('#mod input,#mod select');f&&f.focus()}
const closeM=()=>{MS=null;$('#mod').innerHTML=''},g=i=>$('#'+i).value;
function ok(){if(!MS)return;const r=MS();if(typeof r==='string')$('#mer').textContent=r;else closeM()}
function fuelForm(id){const c=calc(),f=S.fills.find(x=>x.id===id)||{date:today(),odo:c.lo||'',l:'',cost:'',full:true,type:c.v.fuel,st:'',note:''};let w=0;
mod(id?'edit_fillup':'add_fillup',fld('date','date',f.date,'type="date"')+fld('odo','odometer (km)',f.odo,'inputmode="numeric"')+fld('l','litres',f.l,'inputmode="decimal"')+fld('cost','total cost (R)',f.cost,'inputmode="decimal"')+fld('ppl','price per litre (R)',f.l&&f.cost?(f.cost/f.l).toFixed(3):'','inputmode="decimal"')+`<label class="chk"><input type="checkbox" id="full" ${f.full?'checked':''}> full tank</label>`+sel('type','fuel type',FT,f.type)+fld('st','station (optional)',f.st)+fld('note','note',f.note),()=>{
const l=N(g('l')),cost=N(g('cost')),odo=N(g('odo'));if(!(l>0))return'litres must be above 0';if(!(cost>0))return'cost must be above 0';if(odo<c.lo&&!w){w=1;return`warning: odometer is lower than last reading (${K0(c.lo)}). save again to keep it`}
const o={date:D(g('date')),odo,l,cost,full:$('#full').checked,type:O(g('type'),FT,FT[1]),st:T(g('st'),60),note:T(g('note'),200)};
mut(()=>{id?Object.assign(S.fills.find(x=>x.id===id),o):S.fills.push({id:uid(),vid:S.cur,...o})},'fill-up saved')})}
function tripForm(id){const c=calc(),t=S.trips.find(x=>x.id===id)||{date:today(),so:c.lo,eo:'',d:'',from:'',to:'',pt:'business',reason:'',note:''};
mod(id?'edit_trip':'add_trip',fld('date','date',t.date,'type="date"')+fld('so','start odometer',t.so,'inputmode="numeric"')+fld('eo','end odometer',t.eo||'','inputmode="numeric"')+fld('d','or distance (km)',t.d||'','inputmode="decimal"')+fld('from','from',t.from)+fld('to','to',t.to)+sel('pt','purpose',PT,t.pt)+fld('reason','business reason (required for business)',t.reason)+fld('note','note',t.note),()=>{
const so=N(g('so')),eo=N(g('eo')),d=eo>so?eo-so:N(g('d')),pt=g('pt');if(!(d>0))return'distance must be above 0';if(pt==='business'&&!g('reason').trim())return'business reason is required';
const o={date:D(g('date')),so,eo:so+d,d,from:T(g('from'),60),to:T(g('to'),60),pt,reason:T(g('reason'),120),note:T(g('note'),200)};
mut(()=>{id?Object.assign(S.trips.find(x=>x.id===id),o):S.trips.push({id:uid(),vid:S.cur,...o})},'trip saved')})}
function remForm(id){const c=calc(),r=S.rem.find(x=>x.id===id)||{name:'',km:'',mo:'',date:today(),odo:c.lo};
mod(id?'edit_reminder':'add_reminder',`<label>name<input id="name" list="rn" value="${E(r.name)}"><datalist id="rn">${['oil change','tyres','service','licence disc','insurance','roadworthy'].map(x=>`<option value="${x}">`).join('')}</datalist></label>`+fld('km','interval (km)',r.km||'','inputmode="numeric"')+fld('mo','interval (months)',r.mo||'','inputmode="numeric"')+fld('date','last done (date)',r.date,'type="date"')+fld('odo','odometer when last done',r.odo,'inputmode="numeric"'),()=>{
const o={name:T(g('name'),40).trim(),km:Math.max(0,N(g('km'))),mo:Math.max(0,Math.round(N(g('mo')))),date:D(g('date')),odo:Math.max(0,N(g('odo')))};if(!o.name)return'name is required';if(!o.km&&!o.mo)return'set an interval in km, months or both';
mut(()=>{id?Object.assign(S.rem.find(x=>x.id===id),o):S.rem.push({id:uid(),vid:S.cur,paused:false,...o})},'reminder saved')})}
function vehForm(id,kd){const v=S.v.find(x=>x.id===id)||{name:'',kind:kd||'personal',fuel:FT[1],tank:50,odo0:0};
mod(id?'edit_vehicle':'add_vehicle',fld('name','name',v.name)+sel('kind','vehicle type',['personal','work'],v.kind)+sel('fuel','fuel type',FT,v.fuel)+fld('tank','tank size (l)',v.tank,'inputmode="decimal"')+fld('odo0','starting odometer (km)',v.odo0,'inputmode="numeric"'),()=>{
const o={name:T(g('name'),40).trim(),kind:O(g('kind'),['personal','work'],'personal'),fuel:O(g('fuel'),FT,FT[1]),tank:N(g('tank')),odo0:Math.max(0,N(g('odo0')))};if(!o.name)return'name is required';if(!(o.tank>0))return'tank size must be above 0';
mut(()=>{if(id)Object.assign(S.v.find(x=>x.id===id),o);else{const n={id:uid(),...o};S.v.push(n);S.cur=n.id}},'vehicle saved')})}
function quick(){const q=$('#qa').value.trim(),e=$('#qe'),c=calc();let m;
if(m=q.match(/^(\d+(?:[.,]\d+)?)\s*l\s+(\d+(?:[.,]\d+)?)\s+(\d+)$/i)){const l=N(m[1]),cost=N(m[2]);if(!(l>0&&cost>0))return e.textContent='litres and rand must be above 0';mut(()=>S.fills.push({id:uid(),vid:S.cur,date:today(),odo:N(m[3]),l,cost,full:true,type:c.v.fuel,st:'',note:''}),'fill-up saved')}
else if(m=q.match(/^trip\s+(\d+(?:[.,]\d+)?)\s+(business|personal|commute)\s*(.*)$/i)){const d=N(m[1]);if(!(d>0))return e.textContent='distance must be above 0';mut(()=>S.trips.push({id:uid(),vid:S.cur,date:today(),so:c.lo,eo:c.lo+d,d,from:'',to:T(m[3],60),pt:m[2].toLowerCase(),reason:m[2].toLowerCase()==='business'?'business trip':'',note:''}),'trip saved')}
else e.textContent='// try: 45.2l 985 84210  or  trip 18 business sandton'}
function dl(n,t,m){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove()}catch(e){toast('download failed')}}
const lb=()=>mine('trips').sort((a,b)=>a.date.localeCompare(b.date)).map(t=>({date:t.date,start_odometer:t.so,end_odometer:t.eo,distance:t.d,from:t.from,to:t.to,purpose:t.pt,business_reason:t.reason}));
const cq=x=>'"'+(/^[=+\-@]/.test(String(x))?"'":'')+String(x).replace(/"/g,'""')+'"';
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,k=el.dataset.k;
if(a==='tab'){tab=id;render();scrollTo(0,0)}else if(a==='pm'||a==='nm'){mon=sm(mon,a==='pm'?-1:1);render()}
else if(a==='fab')({home:fuelForm,fuel:fuelForm,trips:tripForm,service:remForm})[tab]()
else if(a==='edit')({fills:fuelForm,trips:tripForm,rem:remForm,v:vehForm})[k](id)
else if(a==='addv')vehForm()
else if(a==='kind'){const v=S.v.find(x=>x.kind===id&&x.id===S.cur)||S.v.find(x=>x.kind===id);if(v){S.cur=v.id;save();render()}else vehForm(undefined,id)}
else if(a==='set'){S.set[k]=id;save();render()}
else if(a==='del')mut(()=>{if(k==='v'){S.v=S.v.filter(x=>x.id!==id);['fills','trips','rem'].forEach(q=>S[q]=S[q].filter(x=>x.vid!==id));if(S.cur===id)S.cur=S.v[0].id}else S[k]=S[k].filter(x=>x.id!==id)},'deleted')
else if(a==='done')mut(()=>{const r=S.rem.find(x=>x.id===id);r.date=today();r.odo=calc().lo},'marked done')
else if(a==='pause')mut(()=>{const r=S.rem.find(x=>x.id===id);r.paused=!r.paused},'updated')
else if(a==='undo'){const s=$('#toast')._s;if(s){S=clean(JSON.parse(s))||S;save();render();$('#toast').innerHTML=''}}
else if(a==='ok')ok();else if(a==='x')closeM();else if(a==='qa')quick()
else if(a==='exj')dl('odo-logbook.json',JSON.stringify(lb(),null,2),'application/json')
else if(a==='exc'){const H=['date','start_odometer','end_odometer','distance','from','to','purpose','business_reason'];dl('odo-logbook.csv',[H.join(',')].concat(lb().map(r=>H.map(h=>cq(r[h])).join(','))).join('\n'),'text/csv')}
else if(a==='exp')dl('odo-backup.json',JSON.stringify(S,null,2),'application/json')
else if(a==='imp')$('#imp').click()
else if(a==='erase'){if(el.dataset.c){clearTimeout(et);mut(()=>{S=def()},'all data erased')}else{el.dataset.c=1;el.textContent='[ tap again to erase ]';et=setTimeout(()=>{el.dataset.c='';el.textContent='[ erase all data ]'},4000)}}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='imp'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let n=null;try{n=clean(JSON.parse(r.result))}catch(x){}n?mut(()=>{S=n},'imported'):toast('import failed: invalid file');t.value=''};r.readAsText(f);return}
const s=t.dataset.s;if(!s)return;if(s==='veh')S.cur=t.value;else S.set[s]=s==='rate'?Math.max(0,N(t.value)):t.value;save();render()});
document.addEventListener('input',e=>{const t=e.target;if(!MS||!['l','cost','ppl'].includes(t.id))return;const l=N(g('l'));if(!(l>0))return;if(t.id==='ppl')$('#cost').value=(N(g('ppl'))*l).toFixed(2);else $('#ppl').value=N(g('cost'))>0?(N(g('cost'))/l).toFixed(3):''});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();else if(e.key==='Enter'){if(MS&&e.target.tagName!=='BUTTON'){e.preventDefault();ok()}else if(e.target.id==='qa'){e.preventDefault();quick()}}});
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',theme);render();
</script></body></html>
